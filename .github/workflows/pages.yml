name: Deploy Karya website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify brand assets
        run: |
          test -s dist/brand/icon/karya-icon-dark.png
          test -s dist/brand/icon/karya-icon-light.png
          test -s dist/brand/icon/karya-icon-dark-64.png
          test -s dist/brand/icon/karya-icon-light-64.png
          test -s dist/brand/logo/karya-mark-terracotta-transparent.png
          test -s dist/brand/social/karya-social-preview-1280x640.png
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
